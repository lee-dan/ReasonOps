[project]
name = "reasonops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Inference + grading
    "anthropic>=0.20.0",
    "httpx>=0.24.0",
    "math-verify>=0.1.0",

    # Operator discovery
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",

    # OST model
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",

    # Datasets / benchmarks
    "datasets>=2.14.0",

    # Eval baselines
    "xgboost>=1.7.0",
    "scipy>=1.11.0",

    # Numerics + figures
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "ruff>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reasonops"]

[tool.ruff]
line-length = 100
target-version = "py311"
